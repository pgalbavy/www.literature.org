<nav class="w3-bar reader-toolbar" style="font-size:24px; white-space: nowrap">
  <button class="w3-bar-item w3-button reader-menu-toggle" onclick="w3_toggle()" type="button" title="Open navigation menu" aria-label="Open navigation menu" aria-controls="sidebar" aria-expanded="false"><i class="material-icons md-lit">menu</i></button>
  {{ partial "breadcrumbs.html" .Page }}
  {{ if .ShowNavigation }}
  <div class="reader-toolbar-actions">
    {{ with .Page.NextInSection }}<a class="w3-bar-item w3-button reader-nav-button reader-chapter-nav" href="{{ .RelPermalink }}" title="Previous Chapter" aria-label="Previous Chapter" rel="prev"><i class="material-icons md-lit" aria-hidden="true">arrow_back</i></a>{{ else }}<span class="w3-bar-item w3-button w3-disabled reader-nav-button reader-chapter-nav" title="No previous chapter" aria-label="No previous chapter" aria-disabled="true"><i class="material-icons md-lit" aria-hidden="true">arrow_back</i></span>{{ end }}
    {{ with .Page.PrevInSection }}<a class="w3-bar-item w3-button reader-nav-button reader-chapter-nav" href="{{ .RelPermalink }}" title="Next Chapter" aria-label="Next Chapter" rel="next"><i class="material-icons md-lit" aria-hidden="true">arrow_forward</i></a>{{ else }}<span class="w3-bar-item w3-button w3-disabled reader-nav-button reader-chapter-nav" title="No next chapter" aria-label="No next chapter" aria-disabled="true"><i class="material-icons md-lit" aria-hidden="true">arrow_forward</i></span>{{ end }}
  </div>
  {{ end }}
</nav>
