baseURL = "https://literature.org/"
title = "literature.org"
locale = "en-gb"
contentDir = "content"
staticDir = "static"
disableKinds = ["taxonomy", "term", "RSS"]
enableGitInfo = false

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[params]
  description = "Classic works of English literature"

# Minify the generated HTML whatever command the build host runs
[minify]
  minifyOutput = true

# The CSS and JS live in assets/ (tsc writes assets/js), so they are only
# published as the minified, fingerprinted bundles the layouts make (see
# head.html and baseof.html), which static/_headers caches for a year.


# search-index.json: every author, book and named chapter, for the search
# dialog (layouts/index.searchindex.json, ts/search.ts)
[outputFormats.SearchIndex]
  mediaType = "application/json"
  baseName = "search-index"
  isPlainText = true
  notAlternative = true

[outputs]
  home = ["HTML", "SearchIndex"]
